services:
  - type: web
    name: quantalens-engine
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./apps/engine/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ANALYTICS_DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: AI_PROVIDER_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: AI_MODEL
        value: gemini-3.5-flash
      - key: AI_FALLBACK_MODEL
        value: gemini-3.1-flash-lite
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MAX_UPLOAD_MB
        value: "50"
      - key: PYTHON_MEMORY_MB
        value: "400"
      - key: PYTHON_MAX_CONCURRENT
        value: "1"
